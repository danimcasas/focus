<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a2b">
  <title>Focus · Temporizador</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111a2b;
      --panel: #19243a;
      --panel-light: #202d46;
      --text: #f4f6fb;
      --muted: #9ca9bf;
      --accent: #a9f0d1;
      --accent-strong: #6de0b2;
      --line: rgba(215, 227, 247, .12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(95, 131, 186, .17), transparent 48%),
        var(--bg);
    }
    button { font: inherit; }
    .app { width: min(100%, 590px); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 3px 22px;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(169, 240, 209, .3);
      border-radius: 13px;
      color: var(--accent);
      background: rgba(169, 240, 209, .08);
      font-size: 19px;
    }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
    .local-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .card {
      overflow: hidden;
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(150deg, rgba(32, 45, 70, .97), rgba(25, 36, 58, .97));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .3);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 650;
      letter-spacing: -.045em;
      text-align: center;
    }
    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 30px 0 24px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(8, 14, 25, .28);
    }
    .mode {
      min-height: 46px;
      padding: 10px 8px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .mode:hover { color: var(--text); background: rgba(255, 255, 255, .045); }
    .mode:active, .action:active { transform: translateY(1px); }
    .mode[aria-pressed="true"] {
      border-color: rgba(169, 240, 209, .22);
      color: var(--accent);
      background: rgba(169, 240, 209, .1);
    }
    .clock-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 350px);
      aspect-ratio: 1;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(10, 17, 29, .24) 56%, rgba(10, 17, 29, .04) 57%);
    }
    .clock-wrap::before {
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(169, 240, 209, .12);
      border-radius: 50%;
      content: "";
    }
    .clock-content { z-index: 1; text-align: center; }
    .clock {
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-size: clamp(68px, 17vw, 106px);
      font-weight: 570;
      letter-spacing: -.075em;
      line-height: 1;
    }
    .clock-caption {
      min-height: 20px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .03em;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 26px 0 0;
    }
    .action {
      min-width: 132px;
      min-height: 50px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--panel-light);
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
    }
    .action:hover:not(:disabled) { background: #293955; }
    .action.primary {
      border-color: transparent;
      color: #10241d;
      background: var(--accent);
      font-weight: 700;
    }
    .action.primary:hover:not(:disabled) { background: var(--accent-strong); }
    .action:disabled { cursor: default; opacity: .42; }
    button:focus-visible { outline: 3px solid #e0fff0; outline-offset: 3px; }
    .footnote {
      margin: 23px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 420px) {
      body { padding: 16px 12px; }
      .card { padding: 24px 16px; border-radius: 23px; }
      .topline { margin-bottom: 16px; }
      .local-label { font-size: 10px; }
      .mode { font-size: 13px; }
      .clock-wrap { width: min(100%, 310px); }
      .actions { gap: 9px; }
      .action { min-width: 0; flex: 1; padding: 0 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand" aria-label="Focus">
        <span class="brand-mark" aria-hidden="true">◷</span>
        <span class="brand-name">FOCUS</span>
      </div>
      <span class="local-label">Tu tiempo, a tu ritmo</span>
    </header>

    <section class="card" aria-labelledby="mode-title">
      <p class="eyebrow">Un paso cada vez</p>
      <h1 id="mode-title">Concentración</h1>

      <div class="modes" role="group" aria-label="Modo del temporizador">
        <button class="mode" type="button" data-mode="focus" aria-pressed="true">Concentración</button>
        <button class="mode" type="button" data-mode="study" aria-pressed="false">Estudio</button>
        <button class="mode" type="button" data-mode="rest" aria-pressed="false">Descanso</button>
      </div>

      <div class="clock-wrap" aria-hidden="true">
        <div class="clock-content">
          <p class="clock" id="clock">25:00</p>
          <p class="clock-caption" id="clock-caption">Listo para empezar</p>
        </div>
      </div>
      <p class="sr-only" id="clock-announcement" role="timer" aria-live="off">25 minutos restantes</p>

      <div class="actions">
        <button class="action primary" id="start-button" type="button">Iniciar</button>
        <button class="action" id="pause-button" type="button" disabled>Pausar</button>
        <button class="action" id="reset-button" type="button">Reiniciar</button>
      </div>
      <p class="footnote">Concentración · 25 min &nbsp; Estudio · 50 min &nbsp; Descanso · 10 min</p>
    </section>
  </main>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <script>
    (() => {
      const modes = {
        focus: { label: "Concentración", seconds: 25 * 60 },
        study: { label: "Estudio", seconds: 50 * 60 },
        rest: { label: "Descanso", seconds: 10 * 60 }
      };
      const clock = document.getElementById("clock");
      const caption = document.getElementById("clock-caption");
      const title = document.getElementById("mode-title");
      const startButton = document.getElementById("start-button");
      const pauseButton = document.getElementById("pause-button");
      const resetButton = document.getElementById("reset-button");
      const announcement = document.getElementById("clock-announcement");
      const modeButtons = [...document.querySelectorAll(".mode")];
      let selectedMode = "focus";
      let remainingMs = modes[selectedMode].seconds * 1000;
      let endAt = null;
      let intervalId = null;
      let running = false;

      function formatTime(ms) {
        const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function render() {
        clock.textContent = formatTime(remainingMs);
        const minutes = Math.ceil(remainingMs / 60000);
        announcement.textContent = `${minutes} ${minutes === 1 ? "minuto" : "minutos"} restantes`;
        startButton.disabled = running || remainingMs <= 0;
        pauseButton.disabled = !running;
        if (remainingMs <= 0 && !running) {
          caption.textContent = "Sesión completada";
        } else if (running) {
          caption.textContent = "Sesión en marcha";
        } else if (remainingMs < modes[selectedMode].seconds * 1000) {
          caption.textContent = "Sesión en pausa";
        } else {
          caption.textContent = "Listo para empezar";
        }
      }

      function stopInterval() {
        if (intervalId !== null) {
          window.clearInterval(intervalId);
          intervalId = null;
        }
      }

      function finish() {
        stopInterval();
        running = false;
        remainingMs = 0;
        endAt = null;
        render();
      }

      function tick() {
        remainingMs = Math.max(0, endAt - Date.now());
        if (remainingMs === 0) finish();
        else render();
      }

      startButton.addEventListener("click", () => {
        if (running || remainingMs <= 0) return;
        running = true;
        endAt = Date.now() + remainingMs;
        intervalId = window.setInterval(tick, 200);
        render();
      });

      pauseButton.addEventListener("click", () => {
        if (!running) return;
        remainingMs = Math.max(0, endAt - Date.now());
        stopInterval();
        running = false;
        endAt = null;
        render();
      });

      resetButton.addEventListener("click", () => {
        stopInterval();
        running = false;
        endAt = null;
        remainingMs = modes[selectedMode].seconds * 1000;
        render();
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectedMode = button.dataset.mode;
          modeButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          title.textContent = modes[selectedMode].label;
          stopInterval();
          running = false;
          endAt = null;
          remainingMs = modes[selectedMode].seconds * 1000;
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
